<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    
    /* 核心列印版面設定：頂層定義 @page 消除瀏覽器自帶頁首頁尾與邊界 */
    @page {
      size: A4 portrait;
      margin: 0mm;
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 0;
    }
    
    /* A4 實體規格：210mm x 297mm，嚴格鎖定滿版 */
    .a4-page {
      width: 210mm;
      height: 297mm;
      max-height: 297mm;
      margin: 15mm auto;
      background: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      padding: 6mm 6mm;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: repeat(2, 97mm);
      grid-template-rows: repeat(4, 69mm);
      gap: 3mm 3mm;
      justify-content: center;
      align-content: center;
      page-break-after: always;
      break-after: page;
      page-break-inside: avoid;
      break-inside: avoid;
      overflow: hidden;
    }

    .a4-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    /* 摸彩券卡片本體：填滿 97mm x 69mm */
    .ticket-card {
      position: relative;
      border: 2.5px dashed #dc2626;
      border-radius: 8px;
      padding: 5px 8px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background: #fff;
      height: 69mm;
    }

    .ticket-card.kindergarten { background: #fff1f2; }
    .ticket-card.staff { background: #f0fdf4; }
    .ticket-card.guest { background: #faf5ff; }
    .ticket-card.student { background: #fefce8; }

    .ticket-bg-watermark {
      position: absolute;
      right: -8px;
      bottom: -15px;
      font-size: 80px;
      opacity: 0.05;
      pointer-events: none;
      color: #991b1b;
    }

    @media print {
      html, body {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
      }
      .no-print {
        display: none !important;
      }
      .a4-page {
        margin: 0 !important;
        box-shadow: none !important;
        width: 210mm !important;
        height: 297mm !important;
        max-height: 297mm !important;
        padding: 5mm 6mm !important;
        gap: 2.5mm 2.5mm !important;
      }
    }
  </style>
</head>

    const backupTickets = Array.from({ length: 6 }, (_, i) => ({
      id: 155 + i,
      category: 'guest',
      category_name: '貴賓／志工專用',
      seat_str: '現場加碼',
      name: '＿＿＿＿＿＿',
      role: '貴賓',
      title: '現場備用摸彩券',
      display_label: `現場備用券 ${String(i + 1).padStart(2, '0')}`
    }));

    function loadTickets() {
      allMembersData = [...EMBEDDED_MEMBERS, ...backupTickets];
      renderPages(allMembersData);
    }

    function renderPages(tickets) {
      const container = document.getElementById('pages-container');
      container.innerHTML = '';

      const totalPages = Math.ceil(tickets.length / TICKETS_PER_PAGE);
      document.getElementById('ticket-stats').textContent = `顯示中：${tickets.length} 張（精準 ${totalPages} 頁）`;

      for (let p = 0; p < totalPages; p++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'a4-page';

        const pageTickets = tickets.slice(p * TICKETS_PER_PAGE, (p + 1) * TICKETS_PER_PAGE);

        pageTickets.forEach(t => {
          let catClass = 'student';
          let badgeColor = 'bg-amber-200/80 text-amber-950 border-amber-300';
          let subInfo = `${t.category_name} ｜ 座號 ${t.seat_str} 號`;

          if (t.category === 'kindergarten') {
            catClass = 'kindergarten';
            badgeColor = 'bg-rose-200/80 text-rose-950 border-rose-300';
            subInfo = `${t.category_name} ｜ 座號 ${t.seat_str} 號`;
          } else if (t.category === 'staff') {
            catClass = 'staff';
            badgeColor = 'bg-emerald-200/80 text-emerald-950 border-emerald-300';
            subInfo = `${t.category_name} ｜ ${t.title}`;
          } else if (t.category === 'guest') {
            catClass = 'guest';
            badgeColor = 'bg-purple-200/80 text-purple-950 border-purple-300';
            subInfo = `${t.category_name} ｜ 現場同樂`;
          }

          const card = document.createElement('div');
          card.className = `ticket-card ${catClass}`;
          card.innerHTML = `
            <i class="fa-solid fa-award ticket-bg-watermark"></i>
            
            <!-- 1. 頂部大會抬頭 (極致簡約窄條) -->
            <div class="text-center border-b border-red-300/60 pb-0.5">
              <div class="text-[9px] font-black text-red-900 tracking-wider">
                南興國小 115學年度校慶運動大會 ｜ 🧧 全校大摸彩券 🧧
              </div>
            </div>

            <!-- 2. 班級與座號 (極大滿版橫幅) -->
            <div class="mt-1 text-center">
              <div class="inline-block w-full py-1 rounded-md text-sm md:text-base font-black border ${badgeColor} shadow-2xs tracking-wide">
                ${subInfo}
              </div>
            </div>

            <!-- 3. 姓名 (震撼滿版特大字 54px，長官抽出秒念出！) -->
            <div class="my-auto text-center py-1 flex items-center justify-center">
              <div class="text-5xl md:text-6xl font-black text-black tracking-widest font-serif leading-none transform scale-y-105">
                ${t.name}
              </div>
            </div>

            <!-- 4. 底部裁切提示 (極窄) -->
            <div class="text-[8px] text-gray-500 font-bold text-center flex items-center justify-between border-t border-dashed border-red-300/80 pt-0.5">
              <span>✂️ 沿虛線裁切</span>
              <span class="text-red-800 font-black">投入摸彩箱・人人有獎</span>
              <span>南興三寶金獅獻瑞</span>
            </div>
          `;
          pageDiv.appendChild(card);
        });

        container.appendChild(pageDiv);
      }
    }

    function filterTickets(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active', 'bg-red-600', 'text-white');
        btn.classList.add('bg-gray-100', 'text-gray-700');
      });
      event.target.classList.remove('bg-gray-100', 'text-gray-700');
      event.target.classList.add('active', 'bg-red-600', 'text-white');

      if (cat === 'all') {
        renderPages(allMembersData);
      } else {
        const filtered = allMembersData.filter(t => t.category === cat);
        renderPages(filtered);
      }
    }

    loadTickets();
  </script>
</body>
</html>
